<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  </head>

  <body class="academic-home">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="academic-nav">
      <nav class="academic-nav__inner" aria-label="Homepage sections">
        <a class="academic-nav__brand" href="#about-me">Mengyu Yao</a>

        <div class="academic-nav__links">
          {% for link in site.data.navigation.main %}
            <a href="{{ link.url }}">{{ link.title }}</a>
          {% endfor %}
        </div>

        <details class="academic-nav__menu">
          <summary><span>Menu</span><i class="fas fa-bars" aria-hidden="true"></i></summary>
          <div class="academic-nav__menu-links">
            {% for link in site.data.navigation.main %}
              <a href="{{ link.url }}">{{ link.title }}</a>
            {% endfor %}
          </div>
        </details>
      </nav>
    </header>

    <main id="main" class="academic-shell">
      <article class="academic-page" itemscope itemtype="https://schema.org/ProfilePage">
        <section id="main-content" class="page__content" itemprop="mainEntity" tabindex="-1">
          {{ content }}
        </section>
      </article>
    </main>

    {% include scripts.html %}
    <script>
      (function () {
        var menu = document.querySelector('.academic-nav__menu');
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        var finePointer = window.matchMedia('(pointer: fine)');

        document.querySelectorAll('.academic-nav a[href^="#"]').forEach(function (link) {
          link.addEventListener('click', function (event) {
            var target = document.querySelector(link.getAttribute('href'));
            if (!target) return;

            event.preventDefault();
            target.scrollIntoView({
              behavior: reducedMotion.matches ? 'auto' : 'smooth',
              block: 'start'
            });
            window.history.replaceState(null, '', link.getAttribute('href'));
            if (menu) menu.removeAttribute('open');
          });
        });

        if (finePointer.matches && !reducedMotion.matches) {
          document.addEventListener('pointerdown', function (event) {
            var starCount = 5;

            for (var index = 0; index < starCount; index += 1) {
              var angle = ((Math.PI * 2) / starCount) * index - (Math.PI / 2);
              var distance = 22 + (index % 2) * 8;
              var star = document.createElement('i');
              star.className = 'fas fa-star click-star';
              star.setAttribute('aria-hidden', 'true');
              star.style.setProperty('--spark-left', event.clientX + 'px');
              star.style.setProperty('--spark-top', event.clientY + 'px');
              star.style.setProperty('--spark-x', (Math.cos(angle) * distance).toFixed(2) + 'px');
              star.style.setProperty('--spark-y', (Math.sin(angle) * distance).toFixed(2) + 'px');
              star.style.setProperty('--spark-rotate', ((index + 1) * 52) + 'deg');
              star.style.setProperty('--spark-size', (.5 + (index % 3) * .08) + 'rem');
              document.body.appendChild(star);
              star.addEventListener('animationend', function () {
                this.remove();
              });
            }
          }, { passive: true });
        }
      }());
    </script>
  </body>
</html>
